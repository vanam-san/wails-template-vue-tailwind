name: Bug report
description: Report a template, desktop app, or installer problem
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command you ran and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the template version, Wails version, OS, architecture, and whether you used Docker.
    validations:
      required: true
