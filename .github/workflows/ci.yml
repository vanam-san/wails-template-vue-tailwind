name: Template checks and installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  native:
    name: Native checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: 'go.sum*'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate the official template schema
        if: runner.os == 'Linux' && hashFiles('template.yaml') != ''
        run: |
          curl -fsSL "https://raw.githubusercontent.com/wailsapp/wails/$WAILS_VERSION/docs/mpress/static/schemas/template.v3.json" -o "$RUNNER_TEMP/template.v3.json"
          pipx run --spec check-jsonschema==0.35.0 check-jsonschema --schemafile "$RUNNER_TEMP/template.v3.json" "$GITHUB_WORKSPACE/template.yaml"
      - name: Prepare app
        run: |
          if [[ -f template.yaml ]]; then
            stage="$RUNNER_TEMP/wails-check"
            mkdir -p "$stage/wails-vue-tailwind-ts"
            git archive HEAD | tar -xf - -C "$stage/wails-vue-tailwind-ts"
            cd "$stage"
            wails3 init -n WailsVueStarter -t "$stage/wails-vue-tailwind-ts" -mod example.org/wails/starter -productname "Wails Vue Starter"
            cd WailsVueStarter
            test ! -e frontend/node_modules
            test ! -e frontend/dist
            test ! -e NEXTSTEPS.md
          fi
          echo "APP_DIR=$(pwd)" >> "$GITHUB_ENV"
      - name: Frontend checks
        run: |
          cd "$APP_DIR"
          wails3 generate bindings -ts
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend format:check
          pnpm --dir frontend typecheck
          pnpm --dir frontend lint
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Go checks and native build
        run: |
          cd "$APP_DIR"
          test -z "$(gofmt -l ./*.go)"
          go test ./...
          go vet ./...
          wails3 build
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          cd "$APP_DIR"
          wails3 task darwin:package:dmg
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: macos-dmg
          path: ${{ env.APP_DIR }}/bin/*.dmg
          if-no-files-found: error

  docker-installers:
    name: Windows and Debian installers in Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build toolchain and prepare app
        run: |
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose build
          if [[ -f template.yaml ]]; then
            stage="$RUNNER_TEMP/docker-check"
            mkdir -p "$stage/template" "$stage/projects"
            git archive HEAD | tar -xf - -C "$stage/template"
            docker run --rm \
              --mount "type=bind,source=$stage/template,target=/template-ts,readonly" \
              --mount "type=bind,source=$stage/projects,target=/projects" \
              wails-vue-toolchain wails3 init -d /projects -n WailsVueStarter -t /template-ts \
              -mod example.org/wails/starter -productname "Wails Vue Starter"
            cd "$stage/projects/WailsVueStarter"
          fi
          echo "APP_DIR=$(pwd)" >> "$GITHUB_ENV"
      - name: Build installers
        run: |
          cd "$APP_DIR"
          docker compose run --rm dev wails3 package GOOS=windows ARCH=amd64 FORMAT=nsis INSTALL_SCOPE=user
          docker compose run --rm dev wails3 task linux:create:deb
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: ${{ env.APP_DIR }}/bin/*-installer.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: debian-deb
          path: ${{ env.APP_DIR }}/bin/*.deb
          if-no-files-found: error
