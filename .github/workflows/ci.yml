name: Template checks and installers

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  commitlint:
    name: Lint pull request commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@v6

  native:
    name: Native checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: 'go.sum*'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'wails-bin'
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"
          $env:GOBIN >> $env:GITHUB_PATH
      - name: Validate the official template schema
        if: runner.os == 'Linux' && hashFiles('template.yaml') != ''
        run: |
          curl -fsSL "https://raw.githubusercontent.com/wailsapp/wails/$WAILS_VERSION/docs/mpress/static/schemas/template.v3.json" -o "$RUNNER_TEMP/template.v3.json"
          pipx run --spec check-jsonschema==0.35.0 check-jsonschema --schemafile "$RUNNER_TEMP/template.v3.json" "$GITHUB_WORKSPACE/template.yaml"
      - name: Prepare app
        shell: pwsh
        run: |
          $appDir = $PWD.Path
          if (Test-Path -LiteralPath 'template.yaml' -PathType Leaf) {
            # Exercise the committed template without picking up local build output.
            $stage = Join-Path $env:RUNNER_TEMP 'wails-check'
            $template = Join-Path $stage 'wails-vue-tailwind-ts'
            $archive = Join-Path $stage 'template.zip'
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            git archive --format=zip "--output=$archive" HEAD
            Expand-Archive -LiteralPath $archive -DestinationPath $template
            wails3 init -d "$stage" -n WailsVueStarter -t "$template" -mod example.org/wails/starter -productname "Wails Vue Starter"
            $appDir = Join-Path $stage 'WailsVueStarter'
            foreach ($relativePath in 'frontend/node_modules', 'frontend/dist', 'NEXTSTEPS.md') {
              if (Test-Path -LiteralPath (Join-Path $appDir $relativePath)) {
                throw "Unexpected generated file or directory: $relativePath"
              }
            }
          }
          "APP_DIR=$appDir" >> $env:GITHUB_ENV
      - name: Frontend checks
        id: frontend
        working-directory: ${{ env.APP_DIR }}
        run: |
          wails3 generate bindings -ts
          cd frontend
          test -f bun.lock
          bun install --frozen-lockfile
          bun run format:check
          bun run typecheck
          bun run lint
          bun run test
          bun run build
      - name: Go checks and native build
        id: native-build
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -z "$(gofmt -l ./*.go)"
          go test ./...
          go vet ./...
          wails3 build
      - name: Generate dependency SBOM
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@v0
        env:
          SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: 'true'
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: 'true'
        with:
          path: ${{ env.APP_DIR }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/starter.cdx.json
          upload-release-assets: false
          upload-artifact: false
      - name: Check dependency license metadata
        if: runner.os == 'Linux'
        run: |
          sbom="$RUNNER_TEMP/starter.cdx.json"
          # An incomplete scan must not look like an empty license inventory.
          jq -e '
            [.components[] | .purl // ""] |
            any(startswith("pkg:golang/")) and any(startswith("pkg:npm/"))
          ' "$sbom" >/dev/null
          jq -r '
            [.components[] |
              select((.purl // "") | startswith("pkg:golang/") or startswith("pkg:npm/"))
            ] | group_by(.purl) | map([
              .[0].purl,
              ([.[].licenses[]? | .expression // .license.id // .license.name // empty]
                | unique | if length == 0 then "UNKNOWN" else join("; ") end)
            ]) | sort_by(.[1] != "UNKNOWN", .[0]) |
            (["Package", "Detected licenses"], .[]) | @tsv
          ' "$sbom" > "$RUNNER_TEMP/dependency-licenses.tsv"
          unknown=$(awk -F '\t' '$2 == "UNKNOWN" { count++ } END { print count+0 }' "$RUNNER_TEMP/dependency-licenses.tsv")
          echo "Dependency licenses: $unknown package entries with unknown metadata. See the dependency-inventory artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: dependency-inventory
          path: |
            ${{ runner.temp }}/starter.cdx.json
            ${{ runner.temp }}/dependency-licenses.tsv
          if-no-files-found: error
      - name: Audit frontend dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.frontend.outcome == 'success' }}
        working-directory: ${{ env.APP_DIR }}/frontend
        run: bun audit
      - name: Check Go vulnerabilities
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'dependency-tools'
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:GOBIN 'govulncheck') ./...
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        working-directory: ${{ env.APP_DIR }}
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: macos-dmg
          path: ${{ env.APP_DIR }}/bin/*.dmg
          if-no-files-found: error
          overwrite: true

  docker-installers:
    name: Windows and Debian installers in Docker
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build toolchain and prepare app
        run: |
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose build
          if [[ -f template.yaml ]]; then
            stage="$RUNNER_TEMP/docker-check"
            mkdir -p "$stage/template" "$stage/projects"
            git archive HEAD | tar -xf - -C "$stage/template"
            docker run --rm \
              --mount "type=bind,source=$stage/template,target=/template-ts,readonly" \
              --mount "type=bind,source=$stage/projects,target=/projects" \
              wails-vue-toolchain wails3 init -d /projects -n WailsVueStarter -t /template-ts \
              -mod example.org/wails/starter -productname "Wails Vue Starter"
            cd "$stage/projects/WailsVueStarter"
          fi
          echo "APP_DIR=$(pwd)" >> "$GITHUB_ENV"
      - name: Build installers
        run: |
          cd "$APP_DIR"
          docker compose run --rm --workdir /workspace/frontend dev bun install --frozen-lockfile
          docker compose run --rm dev wails3 package GOOS=windows ARCH=amd64 FORMAT=nsis INSTALL_SCOPE=user
          docker compose run --rm dev wails3 task linux:create:deb
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: ${{ env.APP_DIR }}/bin/*-installer.exe
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: debian-deb
          path: ${{ env.APP_DIR }}/bin/*.deb
          if-no-files-found: error
          overwrite: true

  release-installers:
    name: Attach installers to a draft release
    # Gate the draft on the same checks and artifacts used by branch builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.deleted
    needs: [native, docker-installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-installers-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          shopt -s failglob
          assets=(installers/windows-nsis/*-installer.exe installers/debian-deb/*.deb installers/macos-dmg/*.dmg installers/dependency-inventory/starter.cdx.json)

          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "Release $tag is already published. Installer assets can be uploaded to the draft before publication." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft --title "$tag"
          fi
